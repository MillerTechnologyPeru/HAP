name: Test
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift: ['6.4.1']
    container: swift:${{ matrix.swift }}-noble
    steps:
      - name: Install dependencies
        run: apt update -y; apt install -y libavahi-compat-libdnssd-dev
      - uses: actions/checkout@v4
      - name: Verify Swift version
        run: swift -version | grep ${{ matrix.swift }}
      - name: Run Tests
        run: swift test -c release -Xswiftc -enable-testing
  macOS:
    runs-on: macos-26
    strategy:
      matrix:
        swift: ['6.4.1']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift ${{ matrix.swift }}
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --skip-install --assume-yes
          ~/.swiftly/bin/swiftly install ${{ matrix.swift }} --use --assume-yes
          echo "$HOME/.swiftly/bin" >> $GITHUB_PATH
      - name: Verify Swift version
        run: swift -version | grep ${{ matrix.swift }}
      - name: Run Tests
        run: swift test -c release -Xswiftc -enable-testing
